</head><body class="bg-surface text-on-surface font-body-md text-body-md pt-safe pb-safe min-h-screen flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full">
<div class="relative w-full h-20 bg-inverse-surface/15 backdrop-blur-sm flex items-center justify-center px-5">
<div class="flex items-center gap-2 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full shadow-lg transition-all duration-300" id="toast-pill">
<span class="material-symbols-outlined text-primary-container text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md" id="toast-text">Gasto registrado ✓</span>
</div>
</div>
<div class="w-full bg-surface-container-lowest rounded-t-3xl shadow-xl px-5 pt-3 pb-6 flex flex-col gap-5 -mt-3">
<div class="w-10 h-1 rounded-full bg-surface-variant mx-auto"></div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Novo lançamento</span>
<div class="inline-flex items-center bg-surface-container-low p-1 rounded-full">
<button class="px-5 py-1.5 rounded-full bg-primary-container text-on-primary-fixed font-label-md text-label-md shadow-sm transition-all" id="btn-gasto" onclick="setType('gasto')" type="button">
          Gasto
        </button>
<button class="px-5 py-1.5 rounded-full text-on-surface-variant font-label-md text-label-md transition-all" id="btn-entrada" onclick="setType('entrada')" type="button">
          Entrada
        </button>
</div>
</div>
<div class="flex items-baseline justify-center gap-1.5 py-2">
<span class="font-title-md text-title-md text-on-surface-variant">R$</span>
<span class="font-display-lg text-display-lg text-on-surface tabular-nums" id="amount-display">0,00</span>
</div>
<div class="grid grid-cols-4 gap-2">
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-secondary-container text-on-secondary-container transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">restaurant</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Alimentação</span>
</button>
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">directions_car</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Transporte</span>
</button>
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">confirmation_number</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Lazer</span>
</button>
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">shopping_bag</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Compras</span>
</button>
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">receipt_long</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Contas</span>
</button>
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">favorite</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Saúde</span>
</button>
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">school</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Educação</span>
</button>
<button class="category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
<span class="font-label-sm text-label-sm truncate w-full text-center">Outros</span>
</button>
</div>
<div class="flex items-center gap-2">
<div class="flex-1 min-w-0 flex items-center gap-2 bg-surface-container-low rounded-xl px-3.5 py-2.5">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">edit_note</span>
<input class="w-full bg-transparent font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/70 focus:outline-none" placeholder="Adicionar descrição (opcional)" type="text"/>
</div>
<button class="shrink-0 flex items-center gap-1.5 bg-surface-container-low text-on-surface rounded-xl px-3.5 py-2.5 font-label-md text-label-md active:scale-95 transition-transform" onclick="cycleDate(this)" type="button">
<span class="material-symbols-outlined text-[16px] text-primary">calendar_today</span>
<span id="date-label">Hoje</span>
</button>
</div>
<div class="grid grid-cols-3 gap-2 pt-1">
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('1')" type="button">1</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('2')" type="button">2</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('3')" type="button">3</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('4')" type="button">4</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('5')" type="button">5</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('6')" type="button">6</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('7')" type="button">7</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('8')" type="button">8</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('9')" type="button">9</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey(',')" type="button">,</button>
<button class="h-12 rounded-xl font-headline-md text-headline-md text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="pressKey('0')" type="button">0</button>
<button aria-label="Apagar" class="h-12 rounded-xl flex items-center justify-center text-on-surface hover:bg-surface-container-low active:bg-surface-container transition-colors" onclick="backspace()" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
</div>
<button class="w-full bg-primary-container text-on-primary-fixed font-label-lg text-label-lg py-4 rounded-xl shadow-md active:scale-[0.98] transition-transform" onclick="saveTransaction()" type="button">
      Salvar
    </button>
</div>
</div>
<script>
  let rawDigits = '';
  let currentType = 'gasto';
  const dates = ['Hoje', 'Ontem', '15 Mai'];
  let dateIndex = 0;

  function formatCents(digits) {
    if (!digits) return '0,00';
    const padded = digits.padStart(3, '0');
    const intPart = padded.slice(0, -2).replace(/^0+(?=\d)/, '');
    const decPart = padded.slice(-2);
    const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return formattedInt + ',' + decPart;
  }

  function pressKey(key) {
    if (key === ',') return;
    if (rawDigits.length >= 9) return;
    if (rawDigits === '' && key === '0') return;
    rawDigits += key;
    document.getElementById('amount-display').textContent = formatCents(rawDigits);
  }

  function backspace() {
    rawDigits = rawDigits.slice(0, -1);
    document.getElementById('amount-display').textContent = formatCents(rawDigits);
  }

  function setType(type) {
    currentType = type;
    const btnGasto = document.getElementById('btn-gasto');
    const btnEntrada = document.getElementById('btn-entrada');
    if (type === 'gasto') {
      btnGasto.className = 'px-5 py-1.5 rounded-full bg-primary-container text-on-primary-fixed font-label-md text-label-md shadow-sm transition-all';
      btnEntrada.className = 'px-5 py-1.5 rounded-full text-on-surface-variant font-label-md text-label-md transition-all';
    } else {
      btnEntrada.className = 'px-5 py-1.5 rounded-full bg-primary-container text-on-primary-fixed font-label-md text-label-md shadow-sm transition-all';
      btnGasto.className = 'px-5 py-1.5 rounded-full text-on-surface-variant font-label-md text-label-md transition-all';
    }
  }

  function selectCategory(el) {
    document.querySelectorAll('.category-chip').forEach(chip => {
      chip.className = 'category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-surface-container-low text-on-surface-variant transition-all active:scale-95';
    });
    el.className = 'category-chip flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl bg-secondary-container text-on-secondary-container transition-all active:scale-95';
  }

  function cycleDate() {
    dateIndex = (dateIndex + 1) % dates.length;
    document.getElementById('date-label').textContent = dates[dateIndex];
  }

  function saveTransaction() {
    const toast = document.getElementById('toast-pill');
    const toastText = document.getElementById('toast-text');
    toastText.innerHTML = currentType === 'gasto' ? 'Gasto registrado &check;' : 'Entrada registrada &check;';
    toast.classList.add('scale-105');
    setTimeout(() => toast.classList.remove('scale-105'), 250);
  }
</script></main></body></html>
